name: Assess 2026 retail dataset date coverage

on:
  push:
    branches: [main]
    paths:
      - "scripts/inspect_mendeley_2026_candidate.py"
      - ".github/workflows/assess-2026-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assess-2026-retail-candidate
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect source date coverage
        run: python scripts/inspect_mendeley_2026_candidate.py
      - name: Publish source assessment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/mendeley_2026_candidate_assessment.json
          if ! git diff --cached --quiet; then
            git commit -m "Record verified date coverage for 2026 retail source"
            git pull --rebase origin main
            git push
          fi
