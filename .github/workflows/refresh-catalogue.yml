name: Refresh 2026 product catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch and audit products updated in 2026
        run: python src/pipeline.py
      - name: Commit refreshed dashboard snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/dashboard_data.json reports/data_quality_audit.csv reports/kpis.json reports/source_verification.json dashboard/public/data/dashboard_data.json
          git diff --cached --quiet || (git commit -m "Refresh 2026 Open Food Facts catalogue snapshot" && git push)
